name: capture

on:
  schedule:
    # Runs use the full 6-hour job limit, so four runs a day keeps the crawl
    # effectively continuous. Snapshots publish every --checkpoint-seconds,
    # so a killed runner loses at most a few minutes of work.
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Limit to one host (e.g. en.community.sonos.com); empty = all"
        required: false
        type: string

permissions:
  contents: write # required to create snapshot releases

concurrency:
  # Never overlap two capture runs; lineage is single-writer.
  group: sonos-archive-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression gate
        run: python3 -m unittest -q

      - name: Crawl until the queue drains; publish snapshots along the way
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--remote github --archive-dir "$RUNNER_TEMP/sonos-archive"
                --run-id "$GITHUB_RUN_ID" --checkpoint-seconds 300)
          if [ -n "${{ inputs.host || '' }}" ]; then
            ARGS+=(--host "${{ inputs.host }}")
          fi
          # Capture always publishes checkpoints before returning its status.
          # Do not mark denied/failed work as a green job.
          python3 -m sonos_archive capture "${ARGS[@]}"
