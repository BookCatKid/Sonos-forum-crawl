name: capture

on:
  schedule:
    # Three bounded runs per hour. Each run resumes where the last stopped and
    # publishes an immutable snapshot release when it made progress.
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Limit to one host (e.g. en.community.sonos.com); empty = all"
        required: false
        type: string
      max_requests:
        description: "HTTP request budget for this run"
        required: false
        default: "240"
        type: string
      max_seconds:
        description: "Time budget in seconds for this run"
        required: false
        default: "480"
        type: string

permissions:
  contents: write # required to create snapshot releases

concurrency:
  # Never overlap two capture runs; lineage is single-writer.
  group: sonos-archive-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression gate
        run: python3 -m unittest -q

      - name: Run bounded capture and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAX_REQUESTS="${{ inputs.max_requests || '240' }}"
          MAX_SECONDS="${{ inputs.max_seconds || '480' }}"
          HOST="${{ inputs.host || '' }}"
          ARGS=(--remote github --max-requests "$MAX_REQUESTS" --max-seconds "$MAX_SECONDS")
          if [ -n "$HOST" ]; then
            ARGS+=(--host "$HOST")
          fi
          # Exit codes: 0 clean/budget, 3 host denial persisted (not an error),
          # 4 transient/fail-closed, 5 publish error.
          python3 -m sonos_archive capture "${ARGS[@]}" || code=$?
          code=${code:-0}
          if [ "$code" -eq 3 ]; then
            echo "::notice::A host denied access; stop state persisted. See run output."
            exit 0
          fi
          exit "$code"
