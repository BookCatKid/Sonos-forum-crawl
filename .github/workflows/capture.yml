name: capture

on:
  schedule:
    # A few runs per hour. A run restores the newest snapshot, crawls until
    # its queue drains, and publishes immutable snapshots as it goes, so a
    # killed runner loses at most a few minutes of work.
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      host:
        description: "Limit to one host (e.g. en.community.sonos.com); empty = all"
        required: false
        type: string

permissions:
  contents: write # required to create snapshot releases

concurrency:
  # Never overlap two capture runs; lineage is single-writer.
  group: sonos-archive-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression gate
        run: python3 -m unittest -q

      - name: Crawl until the queue drains; publish snapshots along the way
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--remote github --archive-dir "$RUNNER_TEMP/sonos-archive"
                --run-id "$GITHUB_RUN_ID" --checkpoint-seconds 120)
          if [ -n "${{ inputs.host || '' }}" ]; then
            ARGS+=(--host "${{ inputs.host }}")
          fi
          # Exit codes: 0 clean, 3 denials seen (still publishes), 4 task errors.
          code=0
          python3 -m sonos_archive capture "${ARGS[@]}" || code=$?
          case "$code" in
            0|3|4) exit 0 ;;
            *) exit "$code" ;;
          esac
